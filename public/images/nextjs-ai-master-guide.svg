<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.4)" />
      <stop offset="50%" stop-color="rgba(168, 85, 247, 0.2)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="120" r="220" fill="#00f2fe" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="180" r="260" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="500" r="280" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />

  <!-- Outer Decorative Frame / Circuit Lines -->
  <g stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" fill="none">
    <path d="M 60 100 L 220 100 L 260 60 L 940 60 L 980 100 L 1140 100" />
    <path d="M 60 530 L 240 530 L 280 570 L 920 570 L 960 530 L 1140 530" />
    <circle cx="260" cy="60" r="3" fill="#00f2fe" />
    <circle cx="940" cy="60" r="3" fill="#a855f7" />
    <circle cx="280" cy="570" r="3" fill="#10b981" />
    <circle cx="920" cy="570" r="3" fill="#00f2fe" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(60, 52)">
    <rect width="210" height="34" rx="17" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#00f2fe" filter="url(#subtleGlow)" />
    <text x="36" y="22" fill="#00f2fe" font-size="13" font-weight="700" letter-spacing="1.5">NEXT.JS 16+ MASTER GUIDE</text>
  </g>

  <g transform="translate(930, 52)">
    <rect width="210" height="34" rx="17" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#a855f7" filter="url(#subtleGlow)" />
    <text x="36" y="22" fill="#d8b4fe" font-size="13" font-weight="700" letter-spacing="1.5">AI CODING AGENTS</text>
  </g>

  <!-- Left Column: Typography & Core Highlights -->
  <g transform="translate(60, 140)">
    <!-- Main Title -->
    <text x="0" y="50" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-1">
      Next.js + AI Builders
    </text>
    <text x="0" y="105" fill="url(#cyanGrad)" font-size="44" font-weight="800" letter-spacing="-1" filter="url(#subtleGlow)">
      Production-Grade Master Guide
    </text>

    <!-- Subtitle -->
    <text x="0" y="150" fill="#94a3b8" font-size="19" font-weight="400" width="500">
      Arhitektura, DAL/DTO bezbednost, Caching semantika &amp; Agent protokoli
    </text>

    <!-- 4 Pillars Cards (Left-bottom) -->
    <g transform="translate(0, 190)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="240" height="68" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
        <circle cx="34" cy="34" r="16" fill="rgba(0, 242, 254, 0.12)" />
        <path d="M 28 34 L 33 39 L 41 29" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
        <text x="60" y="29" fill="#ffffff" font-size="14" font-weight="700">DAL + DTO Security</text>
        <text x="60" y="48" fill="#64748b" font-size="12">AuthZ kod pristupa podacima</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(260, 0)">
        <rect width="240" height="68" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
        <circle cx="34" cy="34" r="16" fill="rgba(168, 85, 247, 0.12)" />
        <path d="M 28 38 L 34 26 L 40 38 Z" fill="none" stroke="#a855f7" stroke-width="2" />
        <text x="60" y="29" fill="#ffffff" font-size="14" font-weight="700">Server-First Core</text>
        <text x="60" y="48" fill="#64748b" font-size="12">Minimalni Client Tree</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(0, 82)">
        <rect width="240" height="68" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
        <circle cx="34" cy="34" r="16" fill="rgba(16, 185, 129, 0.12)" />
        <circle cx="34" cy="34" r="7" fill="none" stroke="#10b981" stroke-width="2" />
        <path d="M 34 30 L 34 34 L 37 36" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
        <text x="60" y="29" fill="#ffffff" font-size="14" font-weight="700">Modern Caching</text>
        <text x="60" y="48" fill="#64748b" font-size="12">use cache &amp; Private Isolation</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(260, 82)">
        <rect width="240" height="68" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
        <circle cx="34" cy="34" r="16" fill="rgba(59, 130, 246, 0.12)" />
        <rect x="27" y="27" width="14" height="14" rx="3" fill="none" stroke="#3b82f6" stroke-width="2" />
        <text x="60" y="29" fill="#ffffff" font-size="14" font-weight="700">10-Phase Protocol</text>
        <text x="60" y="48" fill="#64748b" font-size="12">AI Verification Gates</text>
      </g>
    </g>

    <!-- Footer Stats / Meta -->
    <g transform="translate(0, 375)">
      <text x="0" y="0" fill="#64748b" font-size="13" font-weight="600" letter-spacing="1">
        80 PRODUCTION RULES  •  SECURITY THREAT MODEL  •  PLAYWRIGHT &amp; BUILD GATES
      </text>
    </g>
  </g>

  <!-- Right Column: Interactive Holographic UI / Architecture Stack -->
  <g transform="translate(600, 115)">
    <!-- Back Window Glow Frame -->
    <rect x="0" y="0" width="530" height="420" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="url(#borderGrad)" stroke-width="1.5" />

    <!-- Window Top Header -->
    <rect x="0" y="0" width="530" height="42" rx="16" fill="rgba(30, 41, 59, 0.5)" />
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5.5" fill="#10b981" />
    <text x="86" y="26" fill="#94a3b8" font-size="13" font-family="'Fira Code', monospace">architecture/decision-matrix.ts</text>
    <rect x="440" y="10" width="75" height="22" rx="6" fill="rgba(0, 242, 254, 0.15)" />
    <text x="452" y="25" fill="#00f2fe" font-size="11" font-weight="700">PASS 100%</text>

    <!-- Visual Architecture Diagram Inside Mockup -->
    <g transform="translate(25, 60)">
      
      <!-- Tier 1: Client Layer -->
      <g transform="translate(0, 0)">
        <rect width="480" height="60" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1" />
        <rect x="12" y="15" width="30" height="30" rx="6" fill="rgba(244, 63, 94, 0.15)" />
        <text x="21" y="35" fill="#f43f5e" font-size="14" font-weight="700">UI</text>
        <text x="54" y="28" fill="#f1f5f9" font-size="14" font-weight="700">Client Components (Leaves Only)</text>
        <text x="54" y="46" fill="#94a3b8" font-size="11">Interactive state (useState, events, modals) • No secrets, No direct ORM</text>
      </g>

      <!-- Connecting Arrow 1 -->
      <path d="M 240 60 L 240 78" stroke="#00f2fe" stroke-width="2" stroke-dasharray="3,3" />
      <polygon points="237,76 240,82 243,76" fill="#00f2fe" />

      <!-- Tier 2: Server Boundary Layer -->
      <g transform="translate(0, 84)">
        <rect width="480" height="68" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
        <rect x="12" y="19" width="30" height="30" rx="6" fill="rgba(0, 242, 254, 0.15)" />
        <text x="17" y="39" fill="#00f2fe" font-size="12" font-weight="700">RSC</text>
        <text x="54" y="28" fill="#00f2fe" font-size="14" font-weight="700">Server Components + Server Actions</text>
        <text x="54" y="46" fill="#94a3b8" font-size="11">Default rendering engine • Mutations with idempotency &amp; revalidateTag</text>
        <text x="54" y="59" fill="#64748b" font-size="10">Zero Client JS • Direct server composition</text>
      </g>

      <!-- Connecting Arrow 2 -->
      <path d="M 240 152 L 240 170" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3" />
      <polygon points="237,168 240,174 243,168" fill="#a855f7" />

      <!-- Tier 3: DAL + DTO Security Layer -->
      <g transform="translate(0, 176)">
        <rect width="480" height="74" rx="10" fill="rgba(24, 18, 43, 0.9)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5" />
        <rect x="12" y="22" width="30" height="30" rx="6" fill="rgba(168, 85, 247, 0.2)" />
        <text x="16" y="42" fill="#c084fc" font-size="12" font-weight="700">DAL</text>
        <text x="54" y="27" fill="#d8b4fe" font-size="14" font-weight="700">Data Access Layer (DAL) + DTO Shaper</text>
        <text x="54" y="45" fill="#e2e8f0" font-size="11">verifySession() • Tenant Scoping • Ownership Check • DTO Filters</text>
        <rect x="54" y="52" width="160" height="16" rx="4" fill="rgba(168, 85, 247, 0.25)" />
        <text x="60" y="64" fill="#e9d5ff" font-size="10" font-weight="600">server-only boundary</text>
      </g>

      <!-- Connecting Arrow 3 -->
      <path d="M 240 250 L 240 268" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
      <polygon points="237,266 240,272 243,266" fill="#10b981" />

      <!-- Tier 4: Database & Infrastructure Layer -->
      <g transform="translate(0, 274)">
        <rect width="480" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
        <rect x="12" y="14" width="30" height="30" rx="6" fill="rgba(16, 185, 129, 0.15)" />
        <text x="18" y="34" fill="#34d399" font-size="12" font-weight="700">DB</text>
        <text x="54" y="26" fill="#34d399" font-size="13" font-weight="700">Database (ORM) &amp; Object Storage</text>
        <text x="54" y="44" fill="#94a3b8" font-size="11">Transactions • Connection Pooling • Signed URLs • CDN Cache Keys</text>
      </g>

    </g>
  </g>

  <!-- Bottom Accent Lightbar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#cyanGrad)" />
</svg>
